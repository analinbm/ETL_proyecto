version: 2

models:
  - name: fact_table
    description: "Fact table lineitem"
    config:
      contract:
        enforced: true
    columns:
      - name: P_PARTKEY
        data_type: integer
        tests:
          - relationships:
              to: ref('part_dim')
              field: P_PARTKEY

      - name: C_CUSTKEY
        data_type: integer
        tests:
          - relationships:
              to: ref('customer_dim')
              field: C_CUSTKEY

      - name: C_NATIONKEY
        data_type: integer
        tests:
          - relationships:
              to: ref('region_dim')
              field: N_NATIONKEY

      - name: O_ORDERDATE
        data_type: date
        tests:
          - relationships:
              to: ref('time_dim')
              field: SPECIFIC_DATE

      - name: S_SUPPKEY
        data_type: integer
        tests:
          - relationships:
              to: ref('supplier_dim')
              field: S_SUPPKEY

      - name: O_ORDERKEY
        data_type: integer
      - name: S_NATIONKEY
        data_type: integer
      - name: L_QUANTITY
        data_type: integer
      - name: L_SHIPDATE
        data_type: date
      - name: L_COMMITDATE
        data_type: date
      - name: L_RECEIPTDATE
        data_type: date

      - name: COGS_parts
        data_type: decimal
      - name: REVENUE
        data_type: decimal
      - name: net_revenue
        data_type: decimal
      - name: GROSS_PROFIT
        data_type: decimal
      - name: GROSS_MARGIN_percentage
        data_type: decimal

  - name: part_dim
    description: "Product dimension"
    config:
      contract:
        enforced: true
    columns:
      - name: P_PARTKEY
        data_type: integer
        description: "The primary key for this table"
        tests:
          - unique
          - not_null
          - dbt_utils.not_empty_string

      - name: P_NAME
        data_type: varchar(100)
      - name: P_BRAND
        data_type: varchar(20)
      - name: P_TYPE
        data_type: varchar(70)
      - name: P_SIZE
        data_type: integer
      - name: P_RETAILPRICE
        data_type: decimal

  - name: customer_dim
    description: "client"
    config:
      contract:
        enforced: true
    columns:
      - name: C_CUSTKEY
        data_type: integer
        description: "The primary key for this table"
        tests:
          - unique
          - not_null
          - dbt_utils.not_empty_string

      - name: C_NAME
        data_type: varchar(40)
      - name: C_ADDRESS
        data_type: varchar(40)
      - name: C_NATIONKEY
        data_type: integer
      - name: C_PHONE
        data_type: varchar(40)
      - name: C_MKTSEGMENT
        data_type: varchar(40)

  - name: region_dim
    description: "Location"
    config:
      contract:
        enforced: true
    columns:
      - name: N_NATIONKEY
        data_type: integer
        description: "The primary key for this table"
        tests:
          - unique
          - not_null
          - dbt_utils.not_empty_string

      - name: N_NAME
        data_type: varchar(40)
      - name: R_REGIONKEY
        data_type: integer
      - name: R_NAME
        data_type: varchar(40)

  - name: time_dim
    description: "Date"
    config:
      contract:
        enforced: true
    columns:
      - name: SPECIFIC_DATE
        data_type: date
        description: "The primary key for this table"
        tests:
          - unique
          - not_null
          - dbt_utils.not_empty_string

      - name: yy
        data_type: integer
      - name: mm
        data_type: integer
      - name: dd
        data_type: integer
      - name: Trimester
        data_type: integer

  - name: supplier_dim
    description: "supplier"
    config:
      contract:
        enforced: true
    columns:
      - name: S_SUPPKEY
        data_type: integer
        description: "The primary key for this table"
        tests:
          - unique
          - not_null
          - dbt_utils.not_empty_string

      - name: S_NAME
        data_type: varchar(20)
      - name: S_ADDRESS
        data_type: varchar(40)
      - name: S_NATIONKEY
        data_type: integer
      - name: S_PHONE
        data_type: varchar(20)
